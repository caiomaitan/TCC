# Integração contínua do VareSync (F11.4).
# Banco descartável: PostgreSQL 16 em "trust", sem senha real no repositório. VARESYNC_DB_SENHA recebe um valor
# qualquer, que o trust ignora (os testes de integração só exigem que a variável exista).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: varesync
          POSTGRES_DB: varesync_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U varesync -d varesync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      VARESYNC_DB_USUARIO: varesync
      VARESYNC_DB_SENHA: ci-sem-senha
      VARESYNC_DB_TESTE_URL: jdbc:postgresql://localhost:5432/varesync_test
      # Fuso e idioma do computador da loja
      TZ: America/Sao_Paulo
      LANG: pt_BR.UTF-8
      LC_ALL: pt_BR.UTF-8
      # A JVM dos testes recebe o mesmo fuso e idioma de forma explícita (propriedade testes.jvm do pom)
      TESTES_JVM: -Duser.timezone=America/Sao_Paulo -Duser.language=pt -Duser.country=BR

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Idioma pt-BR e tela virtual
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends locales xvfb libgtk-3-0 libxtst6 libxxf86vm1 libgl1
          sudo locale-gen pt_BR.UTF-8
          sudo update-locale LANG=pt_BR.UTF-8

      # Os testes que abrem o JavaFX precisam de tela: no Linux do CI, uma tela virtual (xvfb-run -a).
      # Uma rodada só: o perfil qualidade roda o build e todos os testes (unitários e de integração), com a cobertura,
      # o SpotBugs e o Checkstyle; um "mvn verify" separado repetiria os mesmos testes.
      - name: Build, testes, cobertura e análise estática (mvn -Pqualidade verify)
        run: xvfb-run -a mvn -B -Pqualidade verify "-Dtestes.jvm=${TESTES_JVM}"

      # A varredura de cortes mede as telas como no Windows da loja. No Linux, a fonte "System" do JavaFX é a sem serifa
      # padrão do fontconfig (DejaVu Sans no Ubuntu), 14% a 18% mais larga que a Segoe UI (até 33% no negrito): com a
      # fonte em 130%, Configurações e a barra de status passavam de 1280 px. A Selawik (Microsoft, licença OFL) tem as
      # métricas da Segoe UI; vira a sem serifa padrão só no runner. Versão fixa, conferida pela soma SHA-256.
      - name: Fonte com as métricas da Segoe UI (Selawik) para os testes de interface
        env:
          SELAWIK_URL: https://github.com/microsoft/Selawik/releases/download/1.01/Selawik_Release.zip
          SELAWIK_SHA256: 3f62c51e05e3b5a1e6241cf92a371f0be2ea1183aa87b30718bbd40832a8d423
        run: |
          set -euo pipefail
          echo "Sem serifa antes: $(fc-match sans-serif)"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/selawik.zip" "$SELAWIK_URL"
          echo "$SELAWIK_SHA256  $RUNNER_TEMP/selawik.zip" | sha256sum -c -
          sudo mkdir -p /usr/local/share/fonts/selawik
          # Só a regular e a negrito: as duas que a "System" do JavaFX usa (sem as variantes light e semibold)
          sudo unzip -oj "$RUNNER_TEMP/selawik.zip" selawk.ttf selawkb.ttf -d /usr/local/share/fonts/selawik
          sudo tee /etc/fonts/local.conf > /dev/null <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias binding="strong"><family>sans-serif</family><prefer><family>Selawik</family></prefer></alias>
            <alias binding="strong"><family>sans</family><prefer><family>Selawik</family></prefer></alias>
          </fontconfig>
          EOF
          sudo fc-cache -f
          for padrao in sans-serif sans 'sans:bold' 'sans-serif:lang=pt'; do
            achada="$(fc-match -f '%{family[0]}' "$padrao")"
            echo "fc-match $padrao -> $(fc-match "$padrao")"
            if [ "$achada" != "Selawik" ]; then
              echo "::error::a sem serifa padrão ($padrao) deveria ser a Selawik, e é $achada"
              exit 1
            fi
          done

      # Testes de interface (F11.3): só os *TelaIT, com a pasta de usuário temporária target/ui-home, janelas fora da
      # tela e sem o robô do sistema operacional. Sem "clean": reaproveita a compilação do passo anterior.
      - name: Testes de interface (mvn -Pui verify)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" mvn -B -Pui verify "-Dtestes.jvm=${TESTES_JVM}"

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: target/site/jacoco
          if-no-files-found: warn

      - name: Cobertura dos testes de interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco-ui
          path: target/site/jacoco-ui
          if-no-files-found: warn

      - name: Capturas dos testes de interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-telas
          path: target/telas
          if-no-files-found: warn

      - name: Relatórios do SpotBugs e do Checkstyle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analise-estatica
          path: |
            target/spotbugsXml.xml
            target/checkstyle-result.xml
          if-no-files-found: ignore
